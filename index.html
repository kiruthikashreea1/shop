
<html>
<head>
  <title>Shree's Cafe</title>
  <style>
body {
    text-align: center;
    background-color: lavender;
    font-family: Arial;
}

#cafe {
    text-align: center;
    background-color: purple;
    color: white;
    width: 100%;
    padding: 10px 0;
    animation: appear 2s;
}

h1 {
    color: skyblue;
}

h2, h3, h4 {
    animation: move 2s infinite alternate;
}

p {
    color: yellow;
}

@keyframes appear {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes move {
    from { transform: translateY(0); }
    to { transform: translateY(-5px); }
}
</style>
</head>
<body>
    <div id="cafe">
        <h1>Shree's Cafe</h1>
        <h2>Tea | Coffee | Juice</h2>
        <h3>Jam Bun | Puffs | Cakes</h3>
        <h3>Milkshake</h3>
        <h4>Mojito | Burger Combo</h4>
        <p>Special offers every month on the 10th day!</p>
    </div>
</body>
</html>
