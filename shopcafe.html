<html>
<head>
  <title>Shree's Cafe</title>
  <style>
body {
    text-align: center;
    background-color: lavender;
    font-family: Arial;
}

#cafe {
    text-align: center;
    background-color: purple;
    color:white;
    width:100%;
    padding:10px 0;
    
}
h2,h2,h3,h4{
     animation: appear 2s,move 3s;
}

h1 {
    color: skyblue;
}
p {
    color: yellow;
}

@keyframes appear {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes move {
    from { transform: translateY(0); }
    to { transform: translateY(1,5); }
}
</style>
</head>
<body>
    <div id="cafe">
        <h1>Shree's Cafe</h1>
        <h2>view items are down!</h2>
        <h3>Tea | Coffee | Juice</h3>
        <h3>Jam Bun | Puffs | Cakes</h3>
        <h3>Milkshake | Desserts</h3>
        <h4>Mojito | Burger Combo special</h4>
        <p>Special offers every month on the 10th day!</p>
        <p>LOCATION: pollachi</p>
    </div>
</body>
</html>
